<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* One card on screen at a time. Four worlds, each its own colour. Calm surfaces, loud only on a win. */
:root{
  --bg:#f1eee8;--paper:#fffdf9;--ink:#1c1a2b;--muted:#5d5a6b;--line:#d9d4ca;
  --w1:#5b3fb5;--w1s:#e6dff7;--w2:#b8740a;--w2s:#f7e7c4;--w3:#13756e;--w3s:#d2ebe6;--w4:#b8324a;--w4s:#f5d9de;
  --ok:#2f7a3d;--oks:#d8efd9;--bad:#b0302a;--bads:#f6d8d5;--gold:#d99a00;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#131220;--paper:#1d1c2d;--ink:#ece9f3;--muted:#a6a2b5;--line:#34314b;
  --w1:#a892f2;--w1s:#2b2448;--w2:#f0b43a;--w2s:#3a2f14;--w3:#5cc0b4;--w3s:#163430;--w4:#ec8597;--w4s:#3d1f27;
  --ok:#6cc27b;--oks:#173a1f;--bad:#ef7a70;--bads:#3d1c1a;--gold:#f5c542;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:1.125rem/1.55 var(--f-body);min-height:100dvh;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
a{color:inherit;text-underline-offset:.2em}
:focus-visible{outline:3px solid var(--wc,var(--w1));outline-offset:3px;border-radius:6px}

/* top bar: XP, progress, mute-free (there is no sound) */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + .55rem) max(14px,env(safe-area-inset-right,0px)) .55rem max(14px,env(safe-area-inset-left,0px))}
.bar-in{max-width:44rem;margin:0 auto;display:flex;align-items:center;gap:.8rem}
.home-btn{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.35rem .75rem;font:700 .85rem var(--f-body);cursor:pointer;white-space:nowrap}
.prog{flex:1;height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--w1),var(--w2),var(--w3),var(--w4));transition:width .4s ease}
.xp{font:700 .9rem var(--f-mono);white-space:nowrap;display:flex;align-items:center;gap:.3rem}
.xp b{color:var(--gold)}
.xp.pop{animation:pop .5s ease}
@keyframes pop{40%{transform:scale(1.35)}}

main{max-width:44rem;margin:0 auto;padding:1.2rem max(14px,env(safe-area-inset-right,0px)) 6rem max(14px,env(safe-area-inset-left,0px))}

/* home */
.hello{margin:.6rem 0 1.2rem}
.kicker{font:600 .75rem/1.2 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:850 clamp(2rem,7vw,3.1rem)/1 var(--f-display);font-stretch:115%;margin:.35rem 0 .7rem;text-wrap:balance}
h1 em{font-style:normal;color:var(--w1)}
.lead{margin:0 0 1rem;color:var(--muted)}
.gist{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:1rem 1.1rem;margin-bottom:1.3rem}
.gist summary{cursor:pointer;font:800 1.05rem var(--f-display);list-style:none;display:flex;justify-content:space-between;gap:.5rem}
.gist summary::-webkit-details-marker{display:none}
.gist summary::after{content:"open ▾";font:600 .8rem var(--f-mono);color:var(--muted)}
.gist[open] summary::after{content:"close ▴"}
.gist ol{margin:.7rem 0 0;padding-left:1.3rem}
.gist li{margin:.3rem 0}
.worlds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.8rem}
.world{position:relative;text-align:left;border:0;border-radius:16px;padding:1rem;background:var(--ws);cursor:pointer;display:flex;flex-direction:column;gap:.25rem;min-height:9.5rem;transition:transform .15s ease}
.world:hover{transform:translateY(-2px)}
.world .n{font:700 .72rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--wc)}
.world .t{font:850 1.35rem/1.1 var(--f-display);font-stretch:110%}
.world .d{font-size:.9rem;color:var(--muted);line-height:1.35}
.world .meta{margin-top:auto;display:flex;align-items:center;gap:.5rem;font:600 .78rem var(--f-mono);color:var(--muted)}
.world .meta i{flex:1;height:6px;border-radius:3px;background:var(--paper);overflow:hidden;position:relative}
.world .meta i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--p);background:var(--wc);border-radius:3px}
.world .badge-ico{position:absolute;top:.7rem;right:.8rem;font-size:1.5rem;filter:grayscale(1);opacity:.35}
.world.done .badge-ico{filter:none;opacity:1}
.shelf{margin-top:1.3rem;display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;font-size:.9rem;color:var(--muted)}
.shelf button{border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--muted);padding:0;font-size:.85rem}

/* card */
.where{display:flex;align-items:center;gap:.6rem;margin:.2rem 0 .8rem}
.where .w{font:700 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--wc)}
.dots{display:flex;gap:5px;flex:1;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.seen{background:var(--wc)}
.dots i.now{outline:2px solid var(--wc);outline-offset:2px}
.card{background:var(--paper);border-radius:20px;border:1px solid var(--line);border-top:8px solid var(--wc);padding:1.3rem 1.25rem 1.2rem;box-shadow:0 10px 30px -18px rgba(0,0,0,.35);touch-action:pan-y;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(18px)}}
.card.back{animation:inb .25s ease}
@keyframes inb{from{opacity:0;transform:translateX(-18px)}}
.tag{display:inline-flex;align-items:center;gap:.35rem;font:700 .72rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--ws);color:var(--wc);padding:.35rem .5rem;border-radius:6px}
.card h2{font:850 clamp(1.45rem,5vw,1.95rem)/1.12 var(--f-display);font-stretch:106%;margin:.65rem 0 .55rem;text-wrap:balance}
.card p{margin:0 0 .7rem}
.card ul{margin:0 0 .7rem;padding-left:1.2rem}
.card li{margin:.25rem 0}
.card li::marker{color:var(--wc)}
.big{font:900 clamp(2.4rem,10vw,3.6rem)/1 var(--f-display);color:var(--wc);font-variant-numeric:tabular-nums;margin:.2rem 0 .4rem}
.more{margin-top:.4rem}
.more summary{cursor:pointer;font:700 .88rem var(--f-body);color:var(--muted);list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+ "}
.more[open] summary::before{content:"− "}
.more div{padding:.5rem 0 0;color:var(--muted);font-size:.98rem}
.src{font-size:.85rem;color:var(--muted);margin-top:.6rem}

/* plays */
.opts{display:flex;flex-direction:column;gap:.5rem;margin:.4rem 0 .6rem}
.opt{display:flex;align-items:center;gap:.7rem;text-align:left;border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:.75rem .85rem;cursor:pointer;font-weight:700;line-height:1.3}
.opt:hover:not([disabled]){border-color:var(--wc)}
.opt .k{flex-shrink:0;width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font:700 .8rem var(--f-mono);background:var(--paper);border:1px solid var(--line)}
.opt[aria-pressed="true"]{border-color:var(--wc);background:var(--ws)}
.opt.right{border-color:var(--ok);background:var(--oks)}
.opt.wrong{border-color:var(--bad);background:var(--bads)}
.opt.right .k{background:var(--ok);color:var(--paper);border-color:var(--ok)}
.opt.wrong .k{background:var(--bad);color:var(--paper);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.opt .lean{margin-left:auto;font:600 .68rem var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--wc);white-space:nowrap}
.go{display:inline-flex;align-items:center;gap:.4rem;border:0;border-radius:12px;padding:.75rem 1.1rem;background:var(--ink);color:var(--paper);font:800 1rem var(--f-body);cursor:pointer}
.go[disabled]{opacity:.35;cursor:default}
.fb{border-radius:12px;padding:.75rem .9rem;margin-top:.6rem;animation:in .2s ease}
.fb.ok{background:var(--oks)} .fb.no{background:var(--bads)} .fb.info{background:var(--ws)}
.fb b{display:block;margin-bottom:.2rem}
.fb p{margin:0}
.slide{margin:.6rem 0 .4rem}
.slide output{display:block;font:900 2.4rem/1 var(--f-display);color:var(--wc);font-variant-numeric:tabular-nums;margin-bottom:.4rem}
input[type=range]{width:100%;accent-color:var(--wc);height:2rem}
.scale{display:flex;justify-content:space-between;font:600 .78rem var(--f-mono);color:var(--muted)}
.goal{display:flex;gap:.8rem;flex-wrap:wrap;margin:.4rem 0}
.goal div{flex:1 1 9rem;background:var(--bg);border-radius:12px;padding:.6rem .75rem}
.goal small{display:block;color:var(--muted);font-size:.8rem}
.goal b{font:850 1.4rem var(--f-display);font-variant-numeric:tabular-nums}
.goal b.neg{color:var(--bad)} .goal b.pos{color:var(--ok)}
.chips{display:flex;flex-direction:column;gap:.45rem;margin:.4rem 0 .6rem}
.chip{display:flex;align-items:center;gap:.6rem;border:2px dashed var(--line);background:var(--bg);border-radius:12px;padding:.7rem .85rem;cursor:pointer;font-weight:700;text-align:left}
.chip .k{width:1.7rem;height:1.7rem;border-radius:50%;display:grid;place-items:center;font:800 .85rem var(--f-mono);background:var(--paper);border:1px solid var(--line);flex-shrink:0}
.chip.placed{border-style:solid;border-color:var(--wc);background:var(--ws)}
.chip.placed .k{background:var(--wc);color:var(--paper);border-color:var(--wc)}

/* nav */
.nav{position:fixed;inset:auto 0 0 0;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:.7rem max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + .7rem) max(14px,env(safe-area-inset-left,0px));z-index:5}
.nav-in{max-width:44rem;margin:0 auto;display:flex;gap:.6rem;align-items:center}
.nav button{border-radius:12px;padding:.8rem 1rem;font:800 1rem var(--f-body);cursor:pointer;border:1px solid var(--line);background:var(--paper)}
.nav .next{flex:1;background:var(--wc);color:var(--paper);border-color:var(--wc)}
.nav .next[disabled]{opacity:.4;cursor:default}
.nav .hint{font:600 .72rem var(--f-mono);color:var(--muted);text-align:center;flex:1}

/* rewards */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 5.4rem);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.5rem .9rem;border-radius:999px;font:800 .95rem var(--f-body);z-index:9;animation:toast 1.4s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-8px)}15%,75%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:8;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
.medal{text-align:center;padding:.5rem 0 .2rem}
.medal .ico{font-size:4rem;line-height:1;display:inline-block;animation:medal .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes medal{from{transform:scale(.2) rotate(-30deg)}}
.recap{background:var(--bg);border-radius:12px;padding:.8rem .9rem .8rem 2rem;margin:.6rem 0}
.recap li{margin:.25rem 0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.5rem;margin:.6rem 0 .9rem}
.stats div{background:var(--bg);border-radius:12px;padding:.6rem;text-align:center}
.stats b{display:block;font:900 1.6rem var(--f-display);color:var(--wc)}
.stats small{color:var(--muted);font-size:.8rem}
.picks{background:var(--bg);border-radius:12px;padding:.8rem;font:.88rem/1.5 var(--f-mono);white-space:pre-wrap;margin:.5rem 0}

.left{font:600 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}
.tools{display:flex;gap:.4rem;margin-left:auto}
.tools button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.3rem .6rem;font:700 .78rem var(--f-body);cursor:pointer}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.plan{background:var(--paper);border:1px dashed var(--line);border-radius:14px;padding:.8rem 1rem;margin:0 0 1.2rem}
.plan .q{font-weight:700;margin:0 0 .5rem}
.plan .row{display:flex;gap:.4rem;flex-wrap:wrap}
.plan .row button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:.4rem .75rem;font:700 .85rem var(--f-body);cursor:pointer}
.plan .row button[aria-pressed="true"]{background:var(--w1);color:var(--paper);border-color:var(--w1)}
.plan .then{margin:.6rem 0 0;font-size:.95rem}
body.calm .xp,body.calm .toast,body.calm .confetti,body.calm .medal-xp{display:none!important}
@media (max-width:560px){.prog{display:none}.worlds{grid-template-columns:minmax(0,1fr)}.world{min-height:0}.nav .hint{display:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.confetti{display:none}}
</style>

<div class="bar"><div class="bar-in">
  <button class="home-btn" data-act="home" aria-label="Back to the map">◎ Map</button>
  <div class="prog" role="progressbar" aria-label="Cards done" aria-valuemin="0" aria-valuemax="100"><i id="prog"></i></div>
  <span class="left" id="left"></span>
  <div class="xp" id="xp" aria-live="polite"></div>
</div></div>
<main id="main"></main>
<div class="nav" id="nav" hidden><div class="nav-in">
  <button data-act="prev" aria-label="Previous card">←</button>
  <span class="hint">← → keys or swipe</span>
  <button class="next" data-act="next" id="next">Next →</button>
</div></div>

<script>
window.Q = { worlds: [], ui: {} };
// Link helpers a deck may override: R(file) for a source file, I(n) for a ticket.
window.R = f => f;
window.I = n => '#' + n;
</script>
<script src="c-deck.js" charset="utf-8"></script>
<script>
(() => {
  const KEY = Q.ui.key || 'fq:v1';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const saved = load();
  const S = { calm: !!saved.calm, plan: saved.plan ?? null, xp: saved.xp || 0, done: saved.done || {}, ans: saved.ans || {}, badges: saved.badges || {}, start: saved.start || Date.now(), view: 'home', w: 0, c: 0, dir: 1, tmp: {} };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ calm: S.calm, plan: S.plan, xp: S.xp, done: S.done, ans: S.ans, badges: S.badges, start: S.start, at: [S.w, S.c] })); } catch {} };
  const W = Q.worlds, U = Q.ui;
  if (U.docTitle) document.title = U.docTitle;
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const eur = (n, d = 0) => (n < 0 ? '−€' : '€') + Math.abs(n).toLocaleString('en-GB', { minimumFractionDigits: d, maximumFractionDigits: d });
  const id = (w, c) => W[w].id + ':' + c;
  const total = W.reduce((a, w) => a + w.cards.length, 0);
  const doneCount = () => Object.keys(S.done).length;
  const worldDone = w => W[w].cards.every((_, c) => S.done[id(w, c)]);
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- rewards ----------
  function award(n, why) {
    S.xp += n; save(); drawBar(true);
    if (S.calm) return;
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = `+${n} XP · ${why}`;
    document.body.appendChild(t); setTimeout(() => t.remove(), 1500);
  }
  function confetti() {
    if (reduced || S.calm) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const cols = ['var(--w1)', 'var(--w2)', 'var(--w3)', 'var(--w4)', 'var(--gold)'];
    for (let i = 0; i < 70; i++) { const p = document.createElement('i'); p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % 5]; p.style.animationDelay = Math.random() * .4 + 's'; p.style.transform = `rotate(${Math.random() * 180}deg)`; box.appendChild(p); }
    document.body.appendChild(box); setTimeout(() => box.remove(), 2300);
  }
  function complete(w, c, xp, why) {
    const k = id(w, c);
    if (S.done[k]) return;
    S.done[k] = 1;
    if (xp) award(xp, why); else { save(); drawBar(); }
  }
  function drawBar(pop) {
    document.getElementById('prog').style.width = (doneCount() / total * 100) + '%';
    document.body.classList.toggle('calm', S.calm);
    const left = total - doneCount();
    document.getElementById('left').textContent = left ? U.left.replace('{n}', left).replace('{m}', Math.max(1, Math.round(left * (U.secsPerCard || 30) / 60))) : U.allDoneShort;
    const x = document.getElementById('xp');
    x.innerHTML = `<b>★</b> ${S.xp} XP`;
    if (pop && !reduced) { x.classList.remove('pop'); void x.offsetWidth; x.classList.add('pop'); }
  }

  // ---------- home ----------
  function home() {
    S.view = 'home'; document.getElementById('nav').hidden = true;
    document.body.style.removeProperty('--wc');
    const resume = saved.at && doneCount() > 0 && doneCount() < total;
    const allDone = W.every((_, w) => worldDone(w));
    document.getElementById('main').innerHTML = `
      <div class="hello"><div class="kicker">${md(U.kicker)}</div><h1>${md(U.title).replace(/\{(.+?)\}/, '<em>$1</em>')}</h1><p class="lead">${md(U.lead)}</p></div>
      ${U.planQ ? `<div class="plan"><p class="q">${md(U.planQ)}</p><div class="row">${U.planOpts.map((o, i) => `<button data-plan="${i}" aria-pressed="${S.plan === i}">${esc(o)}</button>`).join('')}</div>${S.plan != null ? `<p class="then">${md(U.planThen.replace('{when}', U.planOpts[S.plan].toLowerCase()))}</p>` : ''}</div>` : ''}
      <details class="gist"><summary>${md(U.gistTitle)}</summary><ol>${U.gist.map(g => `<li>${md(g)}</li>`).join('')}</ol></details>
      <div class="worlds">${W.map((w, i) => {
        const n = w.cards.filter((_, c) => S.done[id(i, c)]).length;
        return `<button class="world ${worldDone(i) ? 'done' : ''}" data-world="${i}" style="--wc:var(--${w.c});--ws:var(--${w.c}s)">
          <span class="badge-ico" aria-hidden="true">${w.badge.ico}</span>
          <span class="n">World ${i + 1} · ${w.mins} min</span><span class="t">${esc(w.title)}</span><span class="d">${md(w.tease)}</span>
          <span class="meta"><i style="--p:${n / w.cards.length * 100}%"></i>${n}/${w.cards.length}</span></button>`;
      }).join('')}</div>
      <div class="shelf">${resume ? `<button data-act="resume" style="font-weight:700;color:var(--ink)">${U.resume} →</button> · ` : ''}${allDone ? `<button data-act="finale" style="font-weight:700;color:var(--ink)">${U.finaleLink}</button> · ` : ''}<span>${U.anyOrder}</span> · <button data-act="calm" aria-pressed="${S.calm}">${S.calm ? U.calmOff : U.calmOn}</button> · <a href="${U.fullLink}" target="_blank" rel="noopener">${U.fullText}</a> · <button data-act="reset">${U.reset}</button></div>`;
    drawBar(); scrollTo(0, 0);
  }

  // ---------- card ----------
  function card() {
    S.view = 'card'; S.tmp = {};
    const w = W[S.w], c = w.cards[S.c], k = id(S.w, S.c);
    document.body.style.setProperty('--wc', `var(--${w.c})`); document.body.style.setProperty('--ws', `var(--${w.c}s)`);
    document.getElementById('nav').hidden = false;
    const isLast = S.c === w.cards.length - 1;
    const dots = w.cards.map((_, i) => `<i class="${S.done[id(S.w, i)] ? 'seen' : ''} ${i === S.c ? 'now' : ''}"></i>`).join('');
    document.getElementById('main').innerHTML = `
      <div class="where"><span class="w">${w.badge.ico} ${esc(w.title)} · ${S.c + 1}/${w.cards.length}</span><span class="dots" aria-hidden="true">${dots}</span>${'speechSynthesis' in window ? `<span class="tools"><button data-act="speak" aria-label="${U.speak}">🔊</button></span>` : ''}</div>
      <article class="card ${S.dir < 0 ? 'back' : ''}" id="card" aria-live="polite">${P[c.type](c, k)}</article>`;
    const nx = document.getElementById('next');
    nx.textContent = isLast ? U.finishWorld : U.next;
    gate();
    if (c.type === 'info' || c.type === 'big') complete(S.w, S.c, 0);
    save(); scrollTo(0, 0);
  }
  // Plays must be answered before Next; reading cards never block.
  function gate() {
    const k = id(S.w, S.c), c = W[S.w].cards[S.c];
    document.getElementById('next').disabled = !(S.done[k] || c.type === 'info' || c.type === 'big');
  }
  const tag = c => `<span class="tag">${esc(c.tag || U.tags[c.type])}</span>`;
  const head = c => `${tag(c)}<h2>${md(c.h)}</h2>`;
  const body = c => (c.p ? (Array.isArray(c.p) ? c.p : [c.p]).map(x => `<p>${md(x)}</p>`).join('') : '') + (c.ul ? `<ul>${c.ul.map(x => `<li>${md(x)}</li>`).join('')}</ul>` : '');
  const more = c => (c.more ? `<details class="more"><summary>${U.more}</summary><div>${(Array.isArray(c.more) ? c.more : [c.more]).map(x => `<p>${md(x)}</p>`).join('')}</div></details>` : '') + (c.src ? `<div class="src">${md(c.src)}</div>` : '');
  const fb = (cls, title, text) => `<div class="fb ${cls}"><b>${md(title)}</b><p>${md(text)}</p></div>`;

  const P = {};
  P.info = c => head(c) + body(c) + more(c);
  P.big = c => head(c) + `<div class="big">${md(c.big)}</div>` + body(c) + more(c);

  // quiz: one right answer; feedback either way, explanation always.
  P.quiz = (c, k) => {
    const a = S.ans[k];
    const opts = c.opts.map((o, i) => {
      let cls = '';
      if (a != null) cls = i === c.right ? 'right' : i === a ? 'wrong' : '';
      return `<button class="opt ${cls}" data-quiz="${i}" ${a != null ? 'disabled' : ''}><span class="k">${'ABCD'[i]}</span><span>${md(o)}</span></button>`;
    }).join('');
    const f = a == null ? '' : a === c.right ? fb('ok', pick(U.yes), c.why) : fb('no', U.no, c.why);
    return head(c) + body(c) + `<div class="opts">${opts}</div>` + f + (a != null ? more(c) : '');
  };
  // guess: slide to a number, then reveal how close it was.
  P.guess = (c, k) => {
    const a = S.ans[k], v = a ?? c.start;
    let f = '';
    if (a != null) { const close = Math.abs(a - c.answer) <= c.tol; f = fb(close ? 'ok' : 'info', (close ? pick(U.yes) + ' ' : '') + U.actual.replace('{v}', c.fmt(c.answer)), c.why); }
    return head(c) + body(c) + `<div class="slide"><output id="gv">${c.fmt(v)}</output><input type="range" id="gr" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}" ${a != null ? 'disabled' : ''} aria-label="${esc(c.h)}"><div class="scale"><span>${c.fmt(c.min)}</span><span>${c.fmt(c.max)}</span></div></div>`
      + (a == null ? `<button class="go" data-act="lock">${U.lock}</button>` : f + more(c));
  };
  // order: tap the items in the right order.
  P.order = (c, k) => {
    const a = S.ans[k];
    const seq = a ? c.items.map((_, i) => i) : (S.tmp.seq || []);
    const pos = i => seq.indexOf(i);
    const chips = c.shown.map(i => `<button class="chip ${pos(i) >= 0 ? 'placed' : ''}" data-order="${i}" ${a ? 'disabled' : ''}><span class="k">${pos(i) >= 0 ? pos(i) + 1 : '·'}</span><span>${md(c.items[i])}</span></button>`).join('');
    let f = '';
    if (a) f = fb(a === 'right' ? 'ok' : 'info', a === 'right' ? pick(U.yes) : U.orderWas, c.why);
    return head(c) + body(c) + `<div class="chips">${chips}</div>` + (a ? f + more(c) : `<button class="go" data-act="undo-order" ${seq.length ? '' : 'disabled'}>${U.undo}</button>`);
  };
  // multi: pick every one that applies.
  P.multi = (c, k) => {
    const a = S.ans[k], sel = a || S.tmp.sel || [];
    const opts = c.opts.map((o, i) => {
      let cls = '';
      if (a) cls = c.right.includes(i) ? 'right' : sel.includes(i) ? 'wrong' : '';
      return `<button class="opt ${cls}" data-multi="${i}" aria-pressed="${sel.includes(i)}" ${a ? 'disabled' : ''}><span class="k">${a ? (c.right.includes(i) ? '✓' : '·') : sel.includes(i) ? '✓' : ''}</span><span>${md(o)}</span></button>`;
    }).join('');
    const exact = a && a.length === c.right.length && a.every(i => c.right.includes(i));
    return head(c) + body(c) + `<div class="opts">${opts}</div>` + (a ? fb(exact ? 'ok' : 'info', exact ? pick(U.yes) : U.close, c.why) + more(c) : `<button class="go" data-act="lock-multi" ${sel.length ? '' : 'disabled'}>${U.lock}</button>`);
  };
  // challenge: move a slider until the goal is met (the stay-link break-even).
  P.challenge = (c, k) => {
    const v = S.ans[k] ?? c.start;
    return head(c) + body(c) + `<div class="slide"><output id="cv">${c.fmt(v)}</output><input type="range" id="cr" min="${c.min}" max="${c.max}" step="${c.step}" value="${v}" aria-label="${esc(c.h)}"></div><div id="cout">${chOut(c, v, k)}</div>` + (S.done[k] ? more(c) : '');
  };
  function chOut(c, v, k) {
    const r = c.calc(v);
    return `<div class="goal">${r.cells.map(x => `<div><small>${x[0]}</small><b class="${x[2] || ''}">${x[1]}</b></div>`).join('')}</div>` + (S.done[k] ? fb('ok', c.win, c.why) : `<p class="src">${md(c.goalText)}</p>`);
  }
  // decide: no right answer. Records the pick for the summary card.
  P.decide = (c, k) => {
    const a = S.ans[k];
    const opts = c.opts.map((o, i) => `<button class="opt" data-decide="${i}" aria-pressed="${a === i}"><span class="k">${'ABCD'[i]}</span><span>${md(o)}</span>${i === c.lean ? `<span class="lean">${U.lean}</span>` : ''}</button>`).join('');
    return head(c) + body(c) + `<div class="opts">${opts}</div>` + (a != null ? fb('info', U.noted, c.after[a] || U.changeAny) : '') + more(c);
  };
  // summary: the picks, ready to paste into the grilling tickets.
  P.summary = (c, k) => {
    const lines = c.from.map(([wk, ci]) => {
      const wi = W.findIndex(w => w.id === wk), cc = W[wi].cards[ci], a = S.ans[id(wi, ci)];
      return `${cc.short}: ${a == null ? '(skipped)' : cc.opts[a].replace(/\*\*/g, '')}\n  ${cc.ticket}`;
    }).join('\n\n');
    if (!S.done[k]) setTimeout(() => { complete(S.w, S.c, c.xp, U.whyRead); gate(); }, 400);
    return head(c) + body(c) + `<div class="picks" id="picks">${esc(lines)}</div><button class="go" data-act="copy">${U.copy}</button>` + more(c);
  };
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  // ---------- world end and finale ----------
  function worldEnd() {
    S.view = 'end';
    const w = W[S.w], first = !S.badges[w.id];
    if (first) { S.badges[w.id] = 1; S.xp += 50; save(); setTimeout(() => { confetti(); drawBar(true); }, 50); }
    const next = W.findIndex((_, i) => !worldDone(i));
    document.getElementById('nav').hidden = true;
    document.getElementById('main').innerHTML = `<article class="card"><div class="medal"><span class="ico">${w.badge.ico}</span></div>
      <h2 style="text-align:center">${U.badgeGot.replace('{b}', esc(w.badge.name))}</h2>
      <p style="text-align:center;color:var(--muted)">${first ? U.bonus : U.again}</p>
      <div class="kicker">${U.recapTitle}</div><ul class="recap">${w.recap.map(r => `<li>${md(r)}</li>`).join('')}</ul>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">${next >= 0 ? `<button class="go" data-world="${next}">${U.nextWorld.replace('{w}', esc(W[next].title))}</button>` : `<button class="go" data-act="finale">${U.finaleBtn}</button>`}<button class="go" data-act="home" style="background:var(--bg);color:var(--ink);border:1px solid var(--line)">◎ ${U.map}</button></div></article>`;
    scrollTo(0, 0);
  }
  function finale() {
    S.view = 'end'; document.getElementById('nav').hidden = true; confetti();
    document.body.style.setProperty('--wc', 'var(--w1)');
    const mins = Math.max(1, Math.round((Date.now() - S.start) / 60000));
    document.getElementById('main').innerHTML = `<article class="card"><div class="medal"><span class="ico">${W.map(w => w.badge.ico).join(' ')}</span></div>
      <h2 style="text-align:center">${U.finaleTitle}</h2>
      <div class="stats"><div><b>${S.xp}</b><small>XP</small></div><div><b>${Object.keys(S.badges).length}/${W.length}</b><small>${U.badges}</small></div><div><b>${mins > 600 ? '—' : mins}</b><small>${U.minutes}</small></div></div>
      <p>${md(U.finaleText)}</p><ul>${U.finaleNext.map(x => `<li>${md(x)}</li>`).join('')}</ul>
      <button class="go" data-act="home">◎ ${U.map}</button></article>`;
    scrollTo(0, 0);
  }

  // ---------- moving ----------
  function go(d) {
    if (S.view !== 'card') return;
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    const w = W[S.w];
    if (d > 0) {
      if (document.getElementById('next').disabled) return;
      if (S.c === w.cards.length - 1) return worldEnd();
      S.c++;
    } else {
      if (S.c === 0) return home();
      S.c--;
    }
    S.dir = d; card();
  }
  function openWorld(i) { S.w = i; const first = W[i].cards.findIndex((_, c) => !S.done[id(i, c)]); S.c = first < 0 ? 0 : first; S.dir = 1; card(); }

  document.addEventListener('click', e => {
    const el = e.target.closest('button'); if (!el) return;
    const d = el.dataset, c = S.view === 'card' ? W[S.w].cards[S.c] : null, k = c ? id(S.w, S.c) : null;
    if (d.world != null) return openWorld(+d.world);
    if (d.act === 'home') return home();
    if (d.act === 'next') return go(1);
    if (d.act === 'prev') return go(-1);
    if (d.act === 'finale') return finale();
    if (d.act === 'calm') { S.calm = !S.calm; save(); return home(); }
    if (d.plan != null) { S.plan = +d.plan; save(); return home(); }
    if (d.act === 'speak') {
      if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
      const el2 = document.getElementById('card'); const txt = [...el2.querySelectorAll('h2, p, li, .opt span:last-child, .fb')].map(n => n.textContent).join('. ');
      speechSynthesis.speak(new SpeechSynthesisUtterance(txt)); return;
    }
    if (d.act === 'resume') { S.w = saved.at[0]; S.c = saved.at[1]; S.dir = 1; return card(); }
    if (d.act === 'reset') { if (confirm(U.resetAsk)) { localStorage.removeItem(KEY); location.reload(); } return; }
    if (d.quiz != null && S.ans[k] == null) { S.ans[k] = +d.quiz; complete(S.w, S.c, +d.quiz === c.right ? 20 : 5, +d.quiz === c.right ? U.whyRight : U.whyTried); return redraw(); }
    if (d.act === 'lock') { const v = +document.getElementById('gr').value; S.ans[k] = v; const close = Math.abs(v - c.answer) <= c.tol; complete(S.w, S.c, close ? 25 : 10, close ? U.whyClose : U.whyTried); return redraw(); }
    if (d.order != null && !S.ans[k]) {
      const seq = S.tmp.seq || (S.tmp.seq = []); const i = +d.order;
      if (!seq.includes(i)) seq.push(i);
      if (seq.length === c.items.length) { const right = seq.every((x, j) => x === j); S.ans[k] = right ? 'right' : 'shown'; complete(S.w, S.c, right ? 20 : 5, right ? U.whyRight : U.whyTried); }
      return redraw();
    }
    if (d.act === 'undo-order') { (S.tmp.seq || []).pop(); return redraw(); }
    if (d.multi != null && !S.ans[k]) { const sel = S.tmp.sel || (S.tmp.sel = []); const i = +d.multi; sel.includes(i) ? sel.splice(sel.indexOf(i), 1) : sel.push(i); return redraw(); }
    if (d.act === 'lock-multi') { const sel = S.tmp.sel.slice(); S.ans[k] = sel; const exact = sel.length === c.right.length && sel.every(i => c.right.includes(i)); complete(S.w, S.c, exact ? 20 : 8, exact ? U.whyRight : U.whyTried); return redraw(); }
    if (d.decide != null) { const first = S.ans[k] == null; S.ans[k] = +d.decide; if (first) complete(S.w, S.c, 15, U.whyDecide); else save(); return redraw(); }
    if (d.act === 'copy') {
      const t = document.getElementById('picks').textContent;
      const ok = () => { el.textContent = U.copied; setTimeout(() => el.textContent = U.copy, 1500); };
      try { navigator.clipboard.writeText(t).then(ok, () => {}); } catch {}
    }
  });
  function redraw() {
    const c = W[S.w].cards[S.c], k = id(S.w, S.c);
    const box = document.getElementById('card'); box.classList.remove('back'); box.style.animation = 'none';
    box.innerHTML = P[c.type](c, k); gate(); save();
  }
  document.addEventListener('input', e => {
    if (S.view !== 'card') return;
    const c = W[S.w].cards[S.c], k = id(S.w, S.c);
    if (e.target.id === 'gr') document.getElementById('gv').textContent = c.fmt(+e.target.value);
    if (e.target.id === 'cr') {
      const v = +e.target.value; S.ans[k] = v;
      document.getElementById('cv').textContent = c.fmt(v);
      if (!S.done[k] && c.calc(v).win) { complete(S.w, S.c, 25, U.whyWin); }
      document.getElementById('cout').innerHTML = chOut(c, v, k); gate(); save();
    }
  });
  document.addEventListener('keydown', e => {
    if (S.view !== 'card' || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
    const n = '1234'.indexOf(e.key);
    if (n >= 0) document.querySelectorAll('#card .opt')[n]?.click();
  });
  // swipe between cards
  let sx = null, sy = null;
  document.addEventListener('pointerdown', e => { if (S.view === 'card' && e.pointerType !== 'mouse' && !e.target.closest('input')) { sx = e.clientX; sy = e.clientY; } });
  document.addEventListener('pointerup', e => {
    if (sx == null) return; const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) go(dx < 0 ? 1 : -1);
  });

  home();
})();
</script>
